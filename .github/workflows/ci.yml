# The AGENTS.md § 2 gate, on every push and pull request (BUILD_ORDER 2.3).
#
# Two jobs, so a Python failure still reports the TypeScript result. No step is
# continue-on-error: a non-blocking check is a check nobody reads.
#
# Each job checks the boilerplate as shipped (no plugins), then installs the example plugin
# (examples/plugins/notes, BUILD_ORDER 3.4) and checks again: the plugin seam is proved on every
# push, and the bare platform is too.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # The suite proves behaviour against the database products deploy, not SQLite (ADR-0005).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A shared cache, as production has: dbx.E005 refuses a per-process one when DEBUG=False.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only throwaway values. There is no .env in CI, and nothing here is a real secret.
    env:
      APP_ENV: ci
      SECRET_KEY: ci-only-insecure-key-not-a-secret
      JWT_SIGNING_KEY: ci-only-insecure-jwt-key-not-a-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      CACHE_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL 16)
        run: uv run pytest

      # backend/'s Ruff run never sees these two; same config, so one style.
      - name: Ruff (scripts/ and examples/)
        run: |
          uv run ruff check --config pyproject.toml ../scripts ../examples
          uv run ruff format --check --config pyproject.toml ../scripts ../examples

      - name: Install the example plugin
        run: |
          cp -R ../examples/plugins/notes plugins/notes
          uv run python ../scripts/plugins.py link notes

      - name: Checks and migrations, with the example plugin
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Tests with the example plugin (PostgreSQL 16)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # scripts/plugins.py is standard library plus backend/core's stdlib-only modules.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the example plugin
        run: |
          cp -R ../examples/plugins/notes ../backend/plugins/notes
          python ../scripts/plugins.py link notes

      - name: ESLint, with the example plugin
        run: npm run lint

      - name: Typecheck, with the example plugin
        run: npm run typecheck

      - name: Tests, with the example plugin
        run: npm test

      - name: Production build, with the example plugin
        run: npm run build
