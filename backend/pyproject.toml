[project]
name = "djangobasex-backend"
version = "0.1.0"
description = "DjangoBaseX backend — Django 5 + Django REST Framework API"
authors = [
    { name = "Ayush Mishra", email = "ayushbm84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23",
    "cryptography>=44",
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "redis>=5",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "ruff>=0.16.6",
]

# Django project, not an installable package — don't build it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "tests", "users"]

[tool.pytest.ini_options]
# The only settings tests ever use: pinned env, in-memory cache/email/storage (ENGINEERING_PRACTICES § 5).
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py"]
# A typo'd marker fails, and every skip prints its reason.
addopts = "--strict-markers -ra"
