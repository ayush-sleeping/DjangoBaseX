# Development stack — Django API + Next.js frontend, both reloading on save.
#
#   docker compose up --build        start (logs stream to the terminal)
#   docker compose up --build -V     after changing package.json / package-lock.json
#   docker compose down              stop
#
# Development only — not a production topology (DEPLOYMENT.md § 0, OPERATIONS.md § 5).
# Uses SQLite in backend/db.sqlite3 (ADR-0005), shared with a host `runserver`, and Redis as the
# shared cache (AUTH_BLUEPRINT § 17.4). Postgres joins with BUILD_ORDER 4.4.
# Ports bind to 127.0.0.1 only (OPERATIONS.md § 15).

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # The shared cache: throttles, lockout, session liveness. Not published to the host. No auth or
  # persistence yet — development only; OPERATIONS.md § 15's authenticated Redis lands with 4.4.
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: redis
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Every value except these comes from backend/.env (copy backend/.env.example first).
    # `backend` is the hostname the frontend container calls it by.
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CACHE_URL: redis://redis:6379/0
      APP_ENV: development  # CONFIGURATION.md § 4: anything else would refuse dev settings
    command: >
      sh -c "uv run --frozen python manage.py migrate --noinput &&
             exec uv run --frozen python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Browser → the published port. Server components → the container network
      # (OPERATIONS.md § 17: INTERNAL_API_URL vs NEXT_PUBLIC_API_URL).
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    # Mirrors the checkout under /repo (see frontend/Dockerfile.dev): plugin frontends are
    # symlinked from backend/plugins, which Turbopack can then resolve inside its root.
    volumes:
      - ./frontend:/repo/frontend
      - /repo/frontend/node_modules
      - /repo/frontend/.next
      - ./backend/plugins:/repo/backend/plugins:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
